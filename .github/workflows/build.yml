name: Build Omore Punch (VST3 & CLAP)

# Pull requests (verification avant fusion), main (apres fusion), tags vX.Y.Z (release) et
# lancement manuel. Les branches de travail ne compilent que via leur pull request.
# Un changement qui ne touche que la documentation (paths-ignore) ne compile pas. GitHub
# n'applique jamais ce filtre aux tags : une release compile toujours.
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
    paths-ignore:
      - '**.md'
      - '.specify/**'
      - 'specs/**'
      - '.claude/**'
      - '.agents/**'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.specify/**'
      - 'specs/**'
      - '.claude/**'
      - '.agents/**'
  workflow_dispatch:

# Un nouveau push sur une pull request annule l'execution precedente de cette meme PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Moindre privilege : lecture seule par defaut, ecriture accordee au seul job `release`.
permissions:
  contents: read

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_suffix: linux-x86_64
          - os: windows-latest
            artifact_suffix: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux X11/GL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-dri2-0-dev \
            libxcb-icccm4-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Verify 100% ASCII compliance in src/lib.rs
        shell: bash
        run: |
          if LC_ALL=C grep -n '[^[:print:][:space:]]' src/lib.rs; then
            echo "ERROR: Non-ASCII characters detected in src/lib.rs!"
            exit 1
          fi
          echo "ASCII check passed."

      - name: Run Workspace Unit Tests
        run: cargo test --workspace --release

      - name: Bundle VST3 and CLAP plugins
        run: cargo run --package xtask --release -- bundle omore-punch --release

      - name: Upload Bundled Plugins (VST3 + CLAP)
        uses: actions/upload-artifact@v4
        with:
          name: Omore-Punch-${{ matrix.artifact_suffix }}
          path: |
            target/bundled/Omore Punch.vst3
            target/bundled/Omore Punch.clap

  release:
    # Publie une GitHub Release quand un tag de version `vX.Y.Z` est pousse : reprend les bundles
    # des deux jobs de build et la section `## [X.Y.Z]` de CHANGELOG.md.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag against Cargo.toml and CHANGELOG.md
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi
          if ! grep -q -F "## [${VERSION}]" CHANGELOG.md; then
            echo "ERROR: no '## [${VERSION}]' section in CHANGELOG.md"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Extract the release notes from CHANGELOG.md
        run: |
          {
            echo "Omore Punch ${VERSION} (VST3 & CLAP), pour Windows x64 et Linux x64."
            echo
            awk -v v="${VERSION}" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md
          } > release-notes.md

      - name: Download Bundled Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip the bundles and compute SHA256SUMS
        run: |
          (cd artifacts/Omore-Punch-windows-x86_64 && zip -qr "${GITHUB_WORKSPACE}/OmorePunch-${VERSION}-windows-x64.zip" .)
          (cd artifacts/Omore-Punch-linux-x86_64 && zip -qr "${GITHUB_WORKSPACE}/OmorePunch-${VERSION}-linux-x64.zip" .)
          sha256sum OmorePunch-*.zip > SHA256SUMS.txt

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${VERSION}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            "OmorePunch-${VERSION}-windows-x64.zip" \
            "OmorePunch-${VERSION}-linux-x64.zip" \
            SHA256SUMS.txt \
            --title "Omore Punch ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag ${PRERELEASE}
