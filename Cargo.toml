[package]
name = "omore-punch"
version = "0.2.0"
edition = "2021"
authors = ["Omore Audio"]
license = "GPL-3.0-or-later"
description = "Stereo Drum Bus Parallel Compressor and Clipper (VST3 / CLAP)"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
atomic_float = "1.1"

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = "none"